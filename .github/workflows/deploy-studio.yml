name: Deploy Story Studio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'NOTICE.md']
permissions:
  contents: read
concurrency:
  group: studio-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package Studio
        run: python tools/build_studio.py
      - name: Deploy authoring application
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          skip_app_build: true
